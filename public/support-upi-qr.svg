<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
  <!-- QR Frame -->
  <g transform="translate(30, 30)">
    <!-- Corner Markers -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#4f46e5" />
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#ffffff" />
    <rect x="20" y="20" width="20" height="20" rx="2" fill="#4f46e5" />

    <rect x="180" y="0" width="60" height="60" rx="8" fill="#4f46e5" />
    <rect x="190" y="10" width="40" height="40" rx="4" fill="#ffffff" />
    <rect x="200" y="20" width="20" height="20" rx="2" fill="#4f46e5" />

    <rect x="0" y="180" width="60" height="60" rx="8" fill="#4f46e5" />
    <rect x="10" y="190" width="40" height="40" rx="4" fill="#ffffff" />
    <rect x="20" y="200" width="20" height="20" rx="2" fill="#4f46e5" />

    <!-- Stylized QR blocks -->
    <rect x="80" y="10" width="20" height="20" fill="#1e293b" />
    <rect x="120" y="10" width="20" height="40" fill="#1e293b" />
    <rect x="80" y="50" width="30" height="20" fill="#1e293b" />
    <rect x="10" y="80" width="30" height="20" fill="#1e293b" />
    <rect x="50" y="90" width="20" height="40" fill="#1e293b" />
    <rect x="90" y="90" width="60" height="60" rx="8" fill="#6366f1" />
    <text x="120" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff">UPI</text>
    <rect x="170" y="80" width="30" height="20" fill="#1e293b" />
    <rect x="210" y="90" width="20" height="30" fill="#1e293b" />
    <rect x="170" y="120" width="20" height="40" fill="#1e293b" />
    <rect x="200" y="140" width="30" height="20" fill="#1e293b" />
    <rect x="80" y="170" width="40" height="20" fill="#1e293b" />
    <rect x="140" y="170" width="20" height="50" fill="#1e293b" />
    <rect x="80" y="210" width="30" height="20" fill="#1e293b" />
    <rect x="180" y="200" width="40" height="30" fill="#1e293b" />
  </g>
  <text x="150" y="282" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b">Scan with any UPI App (GPay, PhonePe, Paytm)</text>
</svg>
